<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Của Tôi</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p {
            color: #7f8c8d;
            font-size: 16px;
        }
        .btn {
            display: inline-block;
            background: #9b59b6;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            background: #8e44ad;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chào mừng bạn! 🚀</h1>
        <p>Đây là trang web chính thức đầu tiên của tôi được xuất bản lên Internet.</p>
        <button class="btn" onclick="ChaoMung()">Bấm vào đây nhé</button>
    </div>

    <script>
        function ChaoMung() {
            alert("Cảm ơn bạn đã ghé thăm trang web của tôi! Chúc bạn một ngày tốt lành! 🎉");
        }
    </script>

</body>
</html>
